<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Finalizar Pedido | Asociación Tecnológica Monterroso</title>

  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.gstatic.com">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/tienda.css">

</head>

<body>

  <!-- BARRA -->
  <header class="barra">
    <div class="contenedor">

      <a href="../pages/tienda.html" class="barra-marca">
        Asociación Tecnológica Monterroso
        <small>Finalizar pedido</small>
      </a>

      <div class="barra-acciones">
        <a href="carrito.html" class="barra-enlace">Volver al carrito</a>
        <a href="carrito.html" class="carrito-boton">
          Carrito
          <span id="contador-carrito" class="contador">0</span>
        </a>
      </div>

    </div>
  </header>

  <!-- ENCABEZADO -->
  <div class="contenedor">
    <div class="pagina-cabecera">
      <h1>Finalizar Pedido</h1>
      <p>Completa tus datos y te contactaremos por WhatsApp para confirmar.</p>
    </div>
  </div>

  <!-- CHECKOUT -->
  <main class="contenedor" id="zonaCheckout">

    <form id="formCompra" class="formulario">

      <button type="button" id="btnGoogle" class="btn btn-google">
        Continuar con Google (opcional)
      </button>

      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input id="nombre" type="text" required>
      </div>

      <div class="campo">
        <label for="telefono">Teléfono / WhatsApp</label>
        <input id="telefono" type="tel" required>
      </div>

      <div class="campo">
        <label for="direccion">Dirección o lugar de entrega</label>
        <textarea id="direccion" required></textarea>
      </div>

      <div class="campo">
        <label for="notas">
          Notas / Personalización
          (texto a grabar, colores, tamaño, referencia de diseño…)
        </label>
        <textarea id="notas"
          placeholder="Ej: nombre 'Ana', color azul, 20 cm de ancho…"></textarea>
      </div>

      <p class="total-checkout">Total: <span id="totalCompra">Q0</span></p>

      <button type="submit" id="btnConfirmar" class="btn btn-ancho">
        Confirmar pedido
      </button>

    </form>

  </main>

  <footer class="pie">
    © 2026 Asociación Tecnológica Monterroso | Todos los derechos reservados
  </footer>

  <script type="module" src="../js/checkout.js"></script>

</body>

</html>
