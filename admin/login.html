<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Administrador | Asociación Tecnológica Monterroso</title>

  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.gstatic.com">

  <link rel="stylesheet" href="css/admin.css">

</head>

<body>

  <div class="login-caja">

    <div class="login-tarjeta">

      <h1>Panel Administrador</h1>
      <p class="sub">Asociación Tecnológica Monterroso</p>

      <form id="loginForm">

        <div class="campo">
          <label for="usuario">Correo electrónico</label>
          <input type="email" id="usuario" placeholder="correo@ejemplo.com" required>
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Contraseña" required>
        </div>

        <button type="submit" class="btn btn-ancho">Ingresar</button>

      </form>

      <div class="login-volver">
        <a href="../index.html">← Volver al inicio</a>
      </div>

    </div>

  </div>

  <script type="module">

    import { firebaseConfigurado } from "../firebase/firebase-config.js";
    import { auth } from "../firebase/firebase-auth.js";

    import {
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    const formulario = document.getElementById("loginForm");

    // Si Firebase todavía no está configurado, avisamos y no dejamos enviar.
    if (!firebaseConfigurado) {

      const aviso = document.createElement("p");
      aviso.style.cssText =
        "background:#7f1d1d;color:#fecaca;padding:12px;border-radius:10px;" +
        "font-size:13px;line-height:1.6;margin-bottom:16px";
      aviso.innerHTML =
        "Falta configurar Firebase. Abre <code>firebase/firebase-config.js</code> " +
        "y pega los datos de tu proyecto. Revisa <code>GUIA_FIREBASE.md</code>.";

      formulario.parentNode.insertBefore(aviso, formulario);

      formulario.querySelector("button").disabled = true;
    }

    formulario.addEventListener("submit", async (e) => {

      e.preventDefault();

      const usuario = document.getElementById("usuario").value.trim();
      const password = document.getElementById("password").value;

      try {
        await signInWithEmailAndPassword(auth, usuario, password);
        window.location.href = "dashboard.html";
      } catch (error) {
        console.error("Error de inicio de sesión:", error);
        alert("Correo o contraseña incorrectos.");
      }

    });

  </script>

</body>

</html>
